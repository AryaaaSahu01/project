# Development only. Bind Postgres to loopback and change credentials for shared machines.
services:
  postgres:
    image: postgres:17-alpine
    container_name: journalapp-dev-postgres
    environment:
      POSTGRES_USER: journal_dev
      POSTGRES_PASSWORD: journal_dev_only_change_me
      POSTGRES_DB: journal_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - journal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal_dev -d journal_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  journal_pgdata:
